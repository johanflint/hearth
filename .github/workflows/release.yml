name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Tag and publish release
        run: npx --yes release-svp@0.1.0 release --repo-url ${{ github.repository }} --token ${{ steps.app-token.outputs.token }} --release-type rust
      # Opens/updates the PR for the *next* release
      - name: Prepare next release
        run: npx --yes release-svp@0.1.0 prepare --repo-url ${{ github.repository }} --token ${{ steps.app-token.outputs.token }} --release-type rust
