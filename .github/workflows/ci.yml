name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # superseded pushes to the same PR/branch cancel the stale run

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Hearth - format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rustup
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --check

  build_and_test:
    name: Hearth - ${{ matrix.toolchain }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            toolchain: stable
          - runner: ubuntu-latest
            toolchain: beta
          - runner: ubuntu-latest
            toolchain: nightly
          - runner: ubuntu-24.04-arm
            toolchain: stable
          - runner: macos-26
            toolchain: stable
    steps:
      - uses: actions/checkout@v7
      - name: Rustup
        run: |
          if [ "${{ matrix.toolchain }}" = "stable" ]; then
            rustup toolchain install
          else
            rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
          fi
      - name: Build
        run: cargo build --verbose --locked
      - name: Tests
        run: cargo test --locked
