name: Rust

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # superseded pushes to the same PR/branch cancel the stale run

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Hearth - ${{ matrix.toolchain }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            toolchain: stable
          - runner: ubuntu-latest
            toolchain: beta
          - runner: ubuntu-latest
            toolchain: nightly
          - runner: ubuntu-24.04-arm
            toolchain: stable
    steps:
      - uses: actions/checkout@v4
      - name: Rustup
        run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - name: Build
        run: cargo build --verbose
      - name: Tests
        run: cargo test --verbose
